<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babi vs. el MIR</title>
<meta name="description" content="El tracker oficial (y muy serio) de los simulacros MIR de Babi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<style>
:root{
  --bg:#fff7f0; --card:#ffffff; --ink:#2b2140; --muted:#7a6f8f;
  --pink:#ff4f9a; --purple:#7c4dff; --yellow:#ffd23f; --green:#19b37a; --red:#ff5d5d;
  --line:#efe3f5; --shadow:0 6px 0 rgba(43,33,64,.9);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1530;--card:#2a1f45;--ink:#fff3e6;--muted:#b3a7cc;--line:#413463;--shadow:0 6px 0 rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;
  background-image:radial-gradient(var(--line) 2px,transparent 2px);background-size:26px 26px}
main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(2rem,7vw,3.4rem);margin:10px 0 0;line-height:1;letter-spacing:-1px}
h1 span{color:var(--pink)}
.tag{color:var(--muted);font-size:1.05rem;margin:8px 0 22px;min-height:1.4em}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:26px}
.card h2{margin:0 0 12px;font-size:1.2rem}
form{display:grid;grid-template-columns:2fr 1.2fr 1fr auto;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;font-weight:700;color:var(--muted);gap:4px}
input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%}
input:focus{outline:3px solid var(--purple)}
button{font:inherit;font-weight:800;cursor:pointer;border:2px solid var(--ink);border-radius:12px;padding:11px 16px;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
button.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 12px;font-size:.85rem}
@media(max-width:640px){form{grid-template-columns:1fr 1fr}form label:first-child{grid-column:1/-1}form button{grid-column:1/-1}}
.hint{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.verdict{display:flex;gap:14px;align-items:center}
.verdict .emoji{font-size:3rem;animation:bob 2s ease-in-out infinite}
.verdict p{margin:0;font-size:1.15rem;font-weight:700}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.stat b{display:block;font-size:1.7rem}
.stat small{color:var(--muted);font-weight:700}
.stat:nth-child(1){background:var(--yellow);color:#2b2140}.stat:nth-child(1) small{color:#4a3f66}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.chartwrap{position:relative}
svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:.85rem;font-weight:700;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .1s}
.goalrow{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--muted);margin-top:8px}
.goalrow input{width:90px;padding:6px 8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}
li:last-child{border:0}
li .n{flex:1;font-weight:800}li .n small{display:block;color:var(--muted);font-weight:600}
li .v{font-size:1.2rem;font-weight:900}
li .d{font-size:.8rem;font-weight:800;padding:2px 8px;border-radius:99px}
.up{background:#d6f7e8;color:#0b7a50}.down{background:#ffe0e0;color:#b32a2a}.eq{background:var(--line);color:var(--muted)}
li button.x{background:transparent;color:var(--muted);border:0;box-shadow:none;padding:4px 8px;font-size:1.1rem}
.empty{text-align:center;color:var(--muted);padding:20px}
footer{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<main>
  <h1>Babi <span>vs.</span> el MIR 🩺</h1>
  <p class="tag" id="tag"></p>

  <section class="card">
    <h2>➕ Nuevo simulacro</h2>
    <form id="f">
      <label>Nombre<input id="name" placeholder="Simulacro 1" autocomplete="off"></label>
      <label>Fecha<input id="date" type="date" required></label>
      <label>Neta<input id="neta" type="number" step="0.01" min="-70" max="200" inputmode="decimal" placeholder="0" required></label>
      <button>Guardar 💾</button>
    </form>
    <p class="hint">Neta = aciertos − errores/3. Que no te engañe el 5 de Mercadona: aquí cuenta la neta.</p>
  </section>

  <section class="card verdict" id="verdict" hidden>
    <div class="emoji" id="emoji"></div><p id="msg"></p>
  </section>

  <div class="stats" id="stats"></div>

  <section class="card">
    <h2>📈 Evolución</h2>
    <div class="chartwrap" id="cw"><svg id="chart" viewBox="0 0 700 320"></svg><div class="tip" id="tip"></div></div>
    <div class="goalrow">🎯 Objetivo (neta): <input id="goal" type="number" step="1" min="0" max="200"></div>
  </section>

  <section class="card">
    <h2>🧾 Historial</h2>
    <ul id="list"></ul>
  </section>

  <footer>
    <button class="ghost" id="exp">⬇️ Copia de seguridad</button>
    <button class="ghost" id="imp">⬆️ Restaurar</button>
    <input type="file" id="file" accept="application/json" hidden>
  </footer>
</main>

<script>
const KEY='babimir.v1';
const $=id=>document.getElementById(id);
let state={sims:[],goal:130};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.sims))state=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('es-ES');
const fdate=d=>new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const sorted=()=>[...state.sims].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);

const tags=['Neta a neta, Babi se hace médica 💪','Plaza en mente, café en vena ☕','Cada simulacro es un Pokémon: hay que cazarlos todos','Las netas suben, la ojeras también 🧟‍♀️','Hoy no, 4 de Medicina Interna. Hoy sí: simulacro.','Futura Dra. Babi, ve reservando la bata 🥼'];
$('tag').textContent=tags[Math.floor(Math.random()*tags.length)];
$('date').value=today();

function verdict(s){
  if(!s.length)return null;
  if(s.length===1)return['🐣','Primer simulacro en el bote. Lo difícil es empezar, lo demás es repetir 150 veces.'];
  const last=s[s.length-1].neta,prev=s[s.length-2].neta,best=Math.max(...s.slice(0,-1).map(x=>x.neta)),d=last-prev;
  if(last>best)return['🏆','¡RÉCORD PERSONAL! Que alguien avise al Ministerio de Sanidad.'];
  if(d>=10)return['🚀','Saltito de '+fmt(d)+' netas. Esto ya no es estudiar, es hacer trampas (legales).'];
  if(d>0)return['📈','Sube '+fmt(d)+'. Pasito a pasito, que Roma no se hizo en un simulacro.'];
  if(d===0)return['😐','Idéntica neta. Estabilidad emocional, al menos.'];
  if(d>-10)return['🫠','Baja '+fmt(-d)+'. Ha sido el simulacro que tenía mala cara. Siguiente.'];
  return['🫂','Bajón de '+fmt(-d)+'. Respira, café, chocolate y a por el siguiente. Los simulacros mienten.'];
}

function render(){
  const s=sorted();
  $('goal').value=state.goal;
  // verdict
  const v=verdict(s);$('verdict').hidden=!v;if(v){$('emoji').textContent=v[0];$('msg').textContent=v[1]}
  // stats
  const nets=s.map(x=>x.neta);
  const avg=nets.length?nets.reduce((a,b)=>a+b,0)/nets.length:0;
  const st=[['Última',nets.length?fmt(nets[nets.length-1]):'–'],['Mejor',nets.length?fmt(Math.max(...nets)):'–'],['Media',nets.length?fmt(avg):'–'],
    ['Vs. primera',nets.length>1?(nets[nets.length-1]-nets[0]>=0?'+':'')+fmt(nets[nets.length-1]-nets[0]):'–']];
  $('stats').innerHTML=st.map(([k,x])=>`<div class="stat"><b>${x}</b><small>${k}</small></div>`).join('');
  // list
  $('list').innerHTML=s.length?[...s].reverse().map((x,i,arr)=>{
    const idx=s.indexOf(x),p=s[idx-1],d=p?x.neta-p.neta:null;
    const badge=d===null?'':`<span class="d ${d>0?'up':d<0?'down':'eq'}">${d>0?'▲ +':d<0?'▼ ':'= '}${fmt(d)}</span>`;
    return`<li><div class="n">${esc(x.name)}<small>${fdate(x.date)}</small></div>${badge}<span class="v">${fmt(x.neta)}</span><button class="x" data-id="${x.id}" title="Borrar">🗑️</button></li>`}).join('')
    :'<li class="empty">Aún no hay simulacros. Los 200 de la tarde no se hacen solos 📚</li>';
  chart(s);
}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chart(s){
  const svg=$('chart'),W=700,H=320,L=44,R=20,T=20,B=40;
  const css=getComputedStyle(document.documentElement);
  const ink=css.getPropertyValue('--ink'),muted=css.getPropertyValue('--muted'),line=css.getPropertyValue('--line');
  if(!s.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="${muted}" font-size="18" font-weight="700">Aquí aparecerá la curva de la gloria ✨</text>`;return}
  const vals=s.map(x=>x.neta).concat(state.goal||0);
  let lo=Math.floor((Math.min(...vals)-10)/10)*10,hi=Math.ceil((Math.max(...vals)+10)/10)*10;
  if(hi-lo<40)hi=lo+40;
  const X=i=>s.length===1?(L+W-R)/2:L+i*(W-L-R)/(s.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g='';
  const step=(hi-lo)/4;
  for(let k=0;k<=4;k++){const v=lo+k*step,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${line}" stroke-width="2"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="${muted}" font-weight="700">${Math.round(v)}</text>`}
  if(state.goal){const y=Y(state.goal);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#19b37a" stroke-width="2.5" stroke-dasharray="7 6"/><text x="${W-R}" y="${y-6}" text-anchor="end" font-size="12" font-weight="800" fill="#19b37a">🎯 plaza soñada (${state.goal})</text>`}
  const pts=s.map((x,i)=>[X(i),Y(x.neta)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');
  const area=path+` L${pts[pts.length-1][0]},${Y(lo)} L${pts[0][0]},${Y(lo)} Z`;
  g+=`<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4f9a" stop-opacity=".35"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></linearGradient></defs>`;
  if(s.length>1)g+=`<path d="${area}" fill="url(#gr)"/><path d="${path}" fill="none" stroke="#ff4f9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const bi=s.reduce((b,x,i)=>x.neta>s[b].neta?i:b,0);
  pts.forEach((p,i)=>{
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="${i===bi?'#ffd23f':'#7c4dff'}" stroke="${ink}" stroke-width="3" data-i="${i}" style="cursor:pointer"/>`;
    if(i===bi)g+=`<text x="${p[0]}" y="${p[1]-16}" text-anchor="middle" font-size="18">👑</text>`;
    if(s.length<=12)g+=`<text x="${p[0]}" y="${H-14}" text-anchor="middle" font-size="11" fill="${muted}" font-weight="700">${fdate(s[i].date)}</text>`;
  });
  svg.innerHTML=g;
  svg.querySelectorAll('circle').forEach(c=>{
    const show=()=>{const i=+c.dataset.i,r=svg.getBoundingClientRect(),k=r.width/W,t=$('tip');
      t.textContent=`${s[i].name}: ${fmt(s[i].neta)}`;t.style.left=pts[i][0]*k+'px';t.style.top=pts[i][1]*k+'px';t.style.opacity=1};
    c.onmouseenter=show;c.onclick=show;c.onmouseleave=()=>$('tip').style.opacity=0;
  });
}

function confetti(){
  const colors=['#ff4f9a','#7c4dff','#ffd23f','#19b37a','#ff5d5d'];
  for(let i=0;i<70;i++){const e=document.createElement('i');e.className='conf';
    e.style.left=Math.random()*100+'vw';e.style.background=colors[i%5];
    e.style.animationDuration=(1.5+Math.random()*1.8)+'s';e.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
}

$('f').onsubmit=e=>{
  e.preventDefault();
  const neta=parseFloat($('neta').value);if(isNaN(neta))return;
  const prevBest=state.sims.length?Math.max(...state.sims.map(x=>x.neta)):-Infinity;
  state.sims.push({id:Date.now(),name:$('name').value.trim()||'Simulacro '+(state.sims.length+1),date:$('date').value||today(),neta});
  save();
  $('name').value='';$('neta').value='';
  render();
  if(neta>prevBest&&state.sims.length>1)confetti();
};
$('list').onclick=e=>{const b=e.target.closest('.x');if(!b)return;
  if(confirm('¿Borrar este simulacro? (¿tan mal fue? 👀)')){state.sims=state.sims.filter(x=>x.id!=b.dataset.id);save();render()}};
$('goal').onchange=()=>{state.goal=parseFloat($('goal').value)||0;save();render()};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='babimir-backup.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(Array.isArray(s.sims)){state={sims:s.sims,goal:s.goal??130};save();render()}else alert('Ese archivo no parece mío 🤨')}catch(_){alert('Ese archivo no parece mío 🤨')}e.target.value=''};
render();
</script>
</body>
</html>
